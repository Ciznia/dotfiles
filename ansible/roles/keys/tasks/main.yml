---
# The `keys` role restores the shared identity. Tasks are split per concern
# and tagged so you can apply a subset, e.g. `--tags ssh` or `--tags gpg`.
- name: SSH key material
  ansible.builtin.import_tasks: ssh.yml
  tags: [keys, ssh]

- name: GPG key material
  ansible.builtin.import_tasks: gpg.yml
  tags: [keys, gpg]

- name: WakaTime API key
  ansible.builtin.import_tasks: wakatime.yml
  tags: [keys, wakatime]
