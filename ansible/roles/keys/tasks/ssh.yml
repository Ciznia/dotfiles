---
- name: Ensure ~/.ssh exists with strict perms
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Install private SSH key from vault
  ansible.builtin.copy:
    content: "{{ vault_ssh_private_key }}"
    dest: "{{ ssh_private_key_path }}"
    mode: "0600"
  no_log: true

- name: Install public SSH key
  ansible.builtin.copy:
    content: "{{ ssh_public_key }}\n"
    dest: "{{ ssh_private_key_path }}.pub"
    mode: "0644"
