# One age key per machine, so a leaked key points at one machine.
# Public keys only: each private key stays in that machine's
# ~/.config/sops/age/keys.txt. After changing the list, run
# `sops updatekeys secrets/<file>.yaml` on a machine that already decrypts.
keys:
  - &atlas age126euaen6mnjxrwxk0fjtjtc79xweem6vs2crmd0mzear6m4hg4zqf7ct08

# First match wins. secrets/<host>.yaml holds that machine's own ssh and gpg
# keys and is encrypted to that machine alone; secrets/secrets.yaml holds what
# every machine shares and is encrypted to all of them.
creation_rules:
  - path_regex: ^secrets/atlas\.yaml$
    key_groups:
      - age:
          - *atlas
  - path_regex: ^secrets/secrets\.yaml$
    key_groups:
      - age:
          - *atlas
